name: Candidates cleanup

# publish-images.yml pushes every image it builds to the candidate package
# ns3-dev-ci, tests it there by digest, and promotes it into ns3-dev by a
# carbon copy (ns3-containers#37). Nobody consumes ns3-dev-ci, so its versions
# are deleted after 7 days. ns3-dev is a separate package: deleting a
# candidate never touches a published image.
on:
  schedule:
    - cron: '41 4 * * *'   # daily 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Delete candidate versions older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          base="/orgs/${ORG}/packages/container/ns3-dev-ci/versions"
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          err="${RUNNER_TEMP}/gh-err"
          if ! all=$(gh api --paginate "${base}?per_page=100" \
                       --jq '.[] | "\(.created_at) \(.id)"' 2>"$err"); then
            if grep -q 'HTTP 404' "$err"; then
              echo "no ns3-dev-ci package (nothing pushed yet)"; exit 0
            fi
            cat "$err" >&2; exit 1
          fi
          # GHCR refuses to delete a package's last version, so the newest one
          # always stays; every other old version is deleted, and any refusal
          # is then a real failure.
          newest=$(printf '%s\n' "$all" | sort -r | head -1 | cut -d' ' -f2)
          ids=$(printf '%s\n' "$all" | awk -v c="$cutoff" -v keep="$newest" '$1 < c && $2 != keep {print $2}')
          n=0; failed=0
          for id in $ids; do
            if gh api -X DELETE "${base}/${id}" >/dev/null; then n=$((n + 1)); else failed=$((failed + 1)); fi
          done
          echo "deleted ${n} candidate versions created before ${cutoff}; ${failed} failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
