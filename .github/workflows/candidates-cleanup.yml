name: Candidates cleanup

# Two packages hold nothing anyone pulls:
#   ns3-dev-ci     publish-images.yml's candidates. Each run deletes its own
#                  once it is clean (its `discard` job); this sweeps whatever a
#                  failed or cancelled run left, after 7 days.
#   ns3-dev-cache  the buildx registry cache. Writing a cache tag leaves the
#                  previous cache manifest untagged and unused; untagged
#                  versions older than a day are deleted.
# The published package, ns3-dev, is never touched: its untagged versions are
# the child and attestation manifests of tagged images (ns3-containers#36).
on:
  schedule:
    - cron: '41 4 * * *'   # daily 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Delete ns3-dev-ci candidates older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          base="/orgs/${ORG}/packages/container/ns3-dev-ci/versions"
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          err="${RUNNER_TEMP}/gh-err"
          if ! all=$(gh api --paginate "${base}?per_page=100" \
                       --jq '.[] | "\(.created_at) \(.id)"' 2>"$err"); then
            if grep -q 'HTTP 404' "$err"; then
              echo "no ns3-dev-ci package (nothing pushed yet)"; exit 0
            fi
            cat "$err" >&2; exit 1
          fi
          # GHCR refuses to delete a package's last version, so the newest one
          # always stays; every other old version is deleted, and any refusal
          # is then a real failure.
          newest=$(printf '%s\n' "$all" | sort -r | head -1 | cut -d' ' -f2)
          ids=$(printf '%s\n' "$all" | awk -v c="$cutoff" -v keep="$newest" '$1 < c && $2 != keep {print $2}')
          n=0; failed=0
          for id in $ids; do
            if gh api -X DELETE "${base}/${id}" >/dev/null; then n=$((n + 1)); else failed=$((failed + 1)); fi
          done
          echo "deleted ${n} candidate versions created before ${cutoff}; ${failed} failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
      - name: Delete untagged ns3-dev-cache versions older than a day
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          base="/orgs/${ORG}/packages/container/ns3-dev-cache/versions"
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          err="${RUNNER_TEMP}/gh-err-cache"
          if ! ids=$(gh api --paginate "${base}?per_page=100" \
                       --jq ".[] | select((.metadata.container.tags | length) == 0 and .created_at < \"${cutoff}\") | .id" 2>"$err"); then
            if grep -q 'HTTP 404' "$err"; then echo "no ns3-dev-cache package"; exit 0; fi
            cat "$err" >&2; exit 1
          fi
          n=0; failed=0
          for id in $ids; do
            if gh api -X DELETE "${base}/${id}" >/dev/null; then n=$((n + 1)); else failed=$((failed + 1)); fi
          done
          echo "deleted ${n} untagged cache versions created before ${cutoff}; ${failed} failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
