name: Publish images

# Builds ghcr.io/swarm-routing/ns3-dev, as generated by tools/ns3_matrix.py
# from upstream's tags (never a hand-kept list).
#
# Automatic pipelines build only the release ns-3 supports: ns-3 maintains its
# latest release only (no maintenance branches, no backports). That release
# gets every profile on Ubuntu, default + debug on Debian and debian-slim, and
# one experimental Alpine image. Any other release is built on demand with the
# `versions` input (Ubuntu x default, debug); its images are history and no
# automatic pipeline rebuilds them.
#
# Build once, test by digest, promote by retagging (ns3-containers#37):
#
#   build    each image is built ONCE and pushed to the candidate package
#            ns3-dev-ci (never pulled by consumers); its digest is recorded
#   test     every test stage (test/run.sh) runs on <candidate>@<digest>,
#            the image that build produced -- never a rebuild, never a tag.
#            An image whose profile has a `split` line in test/ns3-suites.txt
#            (sanitized) is tested by several parallel jobs on that same
#            digest: every stage but unit, and the unit stage (one job, or N
#            shards) (#86); each job leaves its own pass marker
#   promote  an image all of whose test jobs passed gets its versioned and -<sha7> tags
#            by `imagetools create` from that same digest (a carbon copy, no
#            rebuild), then is signed and attested by digest; a
#            non-blocking Trivy CVE report of that digest goes to code scanning
#   canary   the org's ns-3 modules (test/downstream.txt) are built and
#            tested on the ubuntu debug candidate by test/downstream.sh, in
#            parallel with promote (ns3-containers#44); a failing consumer
#            opens or updates an issue here
#   latest   the latest-* tags move last, only when every required image of
#            the run passed and every downstream canary passed (Alpine is
#            experimental: it never blocks)
#
# Automatic and on-demand builds go through the same jobs and the same tests
# (ns3-containers#36). Two exceptions, on pull requests only: the Debian,
# slim and Alpine images run the `light` unit group (UNIT_SET, from the
# matrix entry's pr_unit_set; #87), Ubuntu debug and sanitized keep `full`;
# and every image leaves out the suites on test/ns3-suites.txt's `main-only`
# line (UNIT_PR=1; ns3-tcp-cubic, #86). A PR never tags, and every push to
# main runs every stage with each image's full profile group, main-only
# suites included, before it promotes the digest. A fork PR cannot push a candidate: its build job loads
# the image and runs the same test/run.sh on it in place.
#
# A pull request also tests only the images it affects (#86, #87; the
# `select` job, tools/pr_tests.py). An image whose content (layers and config,
# without the two per-build labels) equals the one main last tested and
# promoted under its versioned tag is not tested again when no test input
# (test/, the test wiring, .trivyignore) changed since main tested it: the
# summary says "unchanged digest, already tested on main". If only test
# inputs changed, the stages they feed run on the representative images
# (`representative` in tools/ns3_matrix.py: Ubuntu debug, sanitized and
# optimized, Debian debug, slim default, Alpine debug). An image whose content
# differs runs every test job. Pushes to main, schedule and dispatch runs
# test every image with every stage, as before, and only they promote.
#
# The downstream canary gates only the rolling latest-* tags, not the
# versioned and -<sha7> tags: it tests the consumers on the image, not the
# image's own contract (test/run.sh does that), and a consumer's bug must not
# withhold an image that passed its tests. On a pull request it runs but is
# advisory (a red job, a green run): a consumer's own breakage on its main
# must not fail an unrelated image PR; main is the gate. Fork PRs have no
# candidate to pull and skip it.
#
#   push to main (docker/, test/, tools/, this file)  supported release: build + test + promote
#   pull request (same paths)                          supported release: build + test; the
#                                                      Debian, slim and Alpine images run the
#                                                      `light` unit group (UNIT_SET, #87); the
#                                                      main-only suites wait for main (UNIT_PR, #86)
#                                                      and only the images and stages the PR
#                                                      affects are tested (select, #86, #87)
#   pull request (any other change)                    nothing built: resolve yields an empty matrix
#   merge group (the merge queue, .github#130)         as a pull request (diffed against the
#                                                      group's base, merge_group.base_sha), but
#                                                      every image runs its full unit group
#                                                      (golden rule 17: `light` is PR-only)
#   schedule (weekly)                                  supported release, only if not yet published
#   workflow_dispatch                                  `versions` (any release, on demand), else
#                                                      the supported release; promote on main
#   workflow_dispatch refresh: true                    OS security refresh (#29): the supported
#                                                      release only (--tier latest; `versions` may
#                                                      name it, any other is refused), built with
#                                                      REFRESH=<run id> so the OS-package layer
#                                                      reruns and picks up the distro's fixes; the
#                                                      rolling tags move, the -<sha7> pins stay
#
# Tags (see tools/ns3_matrix.py): :<ver>-<profile>, :<ver> (= default profile),
# :<ver>-<os>-<profile>, the supported release's :latest-<profile> and :latest,
# and an immutable -<sha7> twin of each versioned tag; pin the twin in anything
# that produces a published number.
#
# Cache: buildx registry cache in ghcr.io/<owner>/ns3-dev-cache, one tag per
# version x os x profile (`mode=max`), outside the 10 GB Actions cache. main
# and same-repo PRs write it and push candidates; fork PRs only read.
# Each clean run deletes its own candidates (the `discard` job, PRs included);
# candidates-cleanup.yml sweeps leftovers after 7 days and the cache's
# untagged versions daily. The only
# workflow artifacts are one-line digest/pass markers, kept 1 day.
#
# The one check to require on main is `images gate`: the workflow runs on
# every pull request, so the gate always reports; it passes when every job
# passed or was skipped (a PR outside the image paths builds nothing) and
# fails on any failure or cancellation.
on:
  push:
    branches: [main]
    paths: ['docker/**', 'test/**', 'tools/**', '.github/workflows/publish-images.yml']
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC: pick up new ns-3 releases
  workflow_dispatch:
    inputs:
      versions:
        description: 'On demand: comma-separated ns-3 releases (e.g. 3.36,3.42); empty = the supported (latest) release'
        required: false
        default: ''
      refresh:
        description: 'OS security refresh: rebuild the supported release with fresh OS packages (REFRESH=<run id>, --tier latest)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ns3-dev
  CANDIDATE: ghcr.io/${{ github.repository_owner }}/ns3-dev-ci
  # Same pin as test/run.sh's security stage.
  TRIVY: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  CACHE: ghcr.io/${{ github.repository_owner }}/ns3-dev-cache
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  # Same-repo PRs and main may write the registry (cache, candidates); fork PRs cannot.
  WRITE_REGISTRY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  resolve:
    name: resolve the ns-3 release(s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tests: ${{ steps.m.outputs.tests }}
      count: ${{ steps.m.outputs.count }}
      canary: ${{ steps.m.outputs.canary }}
      canary_count: ${{ steps.m.outputs.canary_count }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A pull request builds only when it touches what goes into an image or
      # its tests (the paths push to main filters on); any other PR gets an
      # empty matrix, so every job below skips and the gate passes.
      - name: What changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          # A merge group has no pull_request: it diffs against the group's base.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          images=true
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            # --no-renames: a file moved out of an image path counts by its old name too.
            files=$(git diff --name-only --no-renames "$BASE" HEAD)
            printf 'changed:\n%s\n' "$files"
            printf '%s\n' "$files" | grep -qE '^(docker|test|tools)/|^\.github/workflows/publish-images\.yml$' || images=false
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
      - name: Test the matrix generator and the unit shards
        if: steps.changes.outputs.images == 'true'
        run: |
          python3 -m unittest discover -s tools -v
          python3 tools/ns3_matrix.py --check-suites
      - name: Validate the downstream consumer list
        run: test/downstream.sh --check
      - name: Generate the matrix from upstream tags
        id: m
        env:
          VERSIONS: ${{ inputs.versions }}
          REFRESH: ${{ inputs.refresh == true }}
          MISSING_ONLY: ${{ github.event_name == 'schedule' }}
          IMAGES: ${{ steps.changes.outputs.images }}
        run: |
          args=(--sha "$GITHUB_SHA" --image "$IMAGE")
          [ -n "$VERSIONS" ] && args+=(--versions "$VERSIONS")
          [ "$REFRESH" = true ] && args+=(--tier latest)
          [ "$MISSING_ONLY" = true ] && args+=(--missing-only)
          if [ "$IMAGES" = true ]; then
            matrix=$(python3 tools/ns3_matrix.py "${args[@]}")
          else
            matrix='{"include": []}'
            echo "no image path changed: nothing to build" >> "$GITHUB_STEP_SUMMARY"
          fi
          count=$(printf '%s' "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')
          # One test job per image and test part (#86): split images get several.
          tests=$(printf '%s' "$matrix" | python3 -c 'import json,sys; sys.path.insert(0, "tools"); import ns3_matrix as m; print(json.dumps({"include": m.test_matrix(json.load(sys.stdin)["include"])}, separators=(",", ":")))')
          { echo "matrix=$matrix"; echo "tests=$tests"; echo "count=$count"; } >> "$GITHUB_OUTPUT"
          # The downstream canary runs on the ubuntu debug image of each
          # release (what consumers' CI builds on; test/downstream.sh).
          canary=$(printf '%s' "$matrix" | python3 -c 'import json,sys; m=json.load(sys.stdin); print(json.dumps({"include": [e for e in m["include"] if e["os"] == "ubuntu" and e["profile"] == "debug"]}))')
          echo "canary=$canary" >> "$GITHUB_OUTPUT"
          echo "canary_count=$(printf '%s' "$canary" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"
          printf '%s' "$matrix" | python3 -c 'import json,sys; [print(e["name"], "<-", e["version"], "|", e["tags"]) for e in json.load(sys.stdin)["include"]]' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.name }}
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Alpine (musl) is outside ns-3's supported platforms: its failure is
    # reported but never fails the run (ns3-containers#8).
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      packages: write      # registry cache + candidate push
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A fork PR picks its tests here (tools/pr_tests.py diffs from main's tested commit).
          fetch-depth: ${{ env.WRITE_REGISTRY == 'true' && 1 || 0 }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.WRITE_REGISTRY == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The one and only build of this image. It is pushed under a unique
      # candidate tag; everything after this addresses it by digest.
      - name: Build once (push the candidate)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BASE_OS=${{ matrix.os }}
            NS3_VERSION=${{ matrix.version }}
            BUILD_PROFILE=${{ matrix.profile }}
            REVISION=${{ github.sha }}
            BUILD_RUN=${{ github.run_id }}-${{ github.run_attempt }}
            REFRESH=${{ inputs.refresh == true && github.run_id || 'none' }}
          tags: ${{ env.WRITE_REGISTRY == 'true' && format('{0}:{1}-{2}-{3}', env.CANDIDATE, github.run_id, github.run_attempt, matrix.name) || format('ns3-dev-local:{0}', matrix.name) }}
          push: ${{ env.WRITE_REGISTRY == 'true' }}
          # A fork PR cannot push: it loads the image and is tested in place.
          load: ${{ env.WRITE_REGISTRY != 'true' }}
          cache-from: type=registry,ref=${{ env.CACHE }}:${{ matrix.cache }}
          cache-to: ${{ env.WRITE_REGISTRY == 'true' && format('type=registry,ref={0}:{1},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE, matrix.cache) || '' }}
      - name: Record the digest
        if: env.WRITE_REGISTRY == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "no digest from the build: '$DIGEST'" >&2; exit 1 ;; esac
          mkdir -p marker && echo "$DIGEST" > "marker/digest"
          echo "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "marker/build-run"
          echo "candidate \`${CANDIDATE}@${DIGEST}\` ($NAME)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the digest
        if: env.WRITE_REGISTRY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}
          path: |
            marker/digest
            marker/build-run
          retention-days: 1
      # The same choice the select job makes for same-repo PRs, read-only:
      # the loaded image against the public one main promoted.
      - name: Pick the tests (fork PR)
        id: pick
        if: env.WRITE_REGISTRY != 'true'
        env:
          NAME: ${{ matrix.name }}
          ENTRY: ${{ toJSON(matrix) }}
          TAGS: ${{ matrix.tags }}
        run: |
          docker image inspect "ns3-dev-local:${NAME}" > candidate.json
          read -r ref _ <<<"$TAGS"
          docker buildx imagetools inspect "${IMAGE}:${ref}" --format '{{json .Image}}' > reference.json 2>/dev/null || : > reference.json
          python3 tools/pr_tests.py decide --entry "$ENTRY" --candidate candidate.json --reference reference.json > pick.json
          python3 -c 'import json; d=json.load(open("pick.json")); print("run=" + ("true" if d["run"] else "false")); print("stages=" + d["stages"])' >> "$GITHUB_OUTPUT"
          python3 -c 'import json,os; print(os.environ["NAME"], "|", json.load(open("pick.json"))["reason"])' >> "$GITHUB_STEP_SUMMARY"
      - name: Test in place (fork PR, no candidate)
        if: env.WRITE_REGISTRY != 'true' && steps.pick.outputs.run == 'true'
        env:
          NAME: ${{ matrix.name }}
          EXPECT_VERSION: ${{ matrix.version }}
          EXPECT_PROFILE: ${{ matrix.profile }}
          EXPECT_OS: ${{ matrix.os }}
          EXPECT_REVISION: ${{ github.sha }}
          EXPECT_BUILD_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          UNIT_SET: ${{ github.event_name == 'pull_request' && matrix.pr_unit_set || '' }}
          UNIT_PR: ${{ github.event_name == 'pull_request' && '1' || '' }}
          STAGES: ${{ steps.pick.outputs.stages }}
        run: |
          args=()
          [ -n "$STAGES" ] && args+=(--stages "$STAGES")
          test/run.sh "${args[@]}" "ns3-dev-local:${NAME}"

  # Which test jobs run. Pushes to main, schedule and dispatch: every one
  # resolve listed. A pull request: only those of the images and stages it
  # affects (tools/pr_tests.py; #86, #87), each image's candidate compared
  # with what its versioned tag points to (what main last tested and
  # promoted). The summary has a line per image saying what runs and why.
  select:
    name: select the tests
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.outputs.count != '0' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read       # inspect the candidates
    outputs:
      tests: ${{ steps.s.outputs.tests }}
      count: ${{ steps.s.outputs.count }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the diff from the commit main tested each image at
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'pull_request'
        with:
          pattern: digest-*
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: github.event_name == 'pull_request'
      - name: Log in to GHCR
        if: github.event_name == 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select
        id: s
        env:
          EVENT: ${{ github.event_name }}
          MATRIX: ${{ needs.resolve.outputs.matrix }}
          RESOLVED: ${{ needs.resolve.outputs.tests }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            mkdir -p inspect
            # A reference that cannot be read (none yet, a registry error)
            # leaves no file: that image then runs every test job.
            python3 tools/pr_tests.py refs --matrix "$MATRIX" --digests digests \
                --candidate "$CANDIDATE" --image "$IMAGE" |
            while read -r name kind ref; do
              docker buildx imagetools inspect "$ref" --format '{{json .Image}}' > "inspect/${name}.${kind}.json" \
                || { echo "::warning::cannot inspect $ref"; rm -f "inspect/${name}.${kind}.json"; }
            done
            tests=$(python3 tools/pr_tests.py select --matrix "$MATRIX" --inspect inspect --summary "$GITHUB_STEP_SUMMARY")
          else
            tests=$RESOLVED
            echo "every test job of every image (${EVENT})" >> "$GITHUB_STEP_SUMMARY"
          fi
          count=$(printf '%s' "$tests" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')
          { echo "tests=$tests"; echo "count=$count"; } >> "$GITHUB_OUTPUT"
          echo "${count} test job(s)" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test ${{ matrix.test_name }}
    needs: [resolve, build, select]
    # Run each image's tests even if another image failed to build; a leg
    # whose own build failed finds no digest and fails here, which is right.
    # No job at all when select chose none (a PR whose images main already tested).
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      packages: read       # pull the candidate; tests can never push or tag
    strategy:
      fail-fast: false
      # One job per image and test part: a split image (sanitized) runs its
      # unit stage beside its other stages, each on the same candidate digest (#86).
      matrix: ${{ fromJSON(needs.select.outputs.tests) }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.name }}
          path: marker
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the candidate by digest
        id: pull
        run: |
          ref="${CANDIDATE}@$(cat marker/digest)"
          docker pull "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # The attempt that BUILT the candidate: a re-run of a failed test
          # job tests the same candidate under a later run attempt.
          echo "build_run=$(cat marker/build-run)" >> "$GITHUB_OUTPUT"
      - name: Test stages
        env:
          REF: ${{ steps.pull.outputs.ref }}
          EXPECT_VERSION: ${{ matrix.version }}
          EXPECT_PROFILE: ${{ matrix.profile }}
          EXPECT_OS: ${{ matrix.os }}
          EXPECT_REVISION: ${{ github.sha }}
          EXPECT_BUILD_RUN: ${{ steps.pull.outputs.build_run }}
          # Pull requests only: the OS variants run the light unit group (#87),
          # and the main-only suites of test/ns3-suites.txt wait for main (#86).
          UNIT_SET: ${{ github.event_name == 'pull_request' && matrix.pr_unit_set || '' }}
          UNIT_PR: ${{ github.event_name == 'pull_request' && '1' || '' }}
          STAGES: ${{ matrix.stages }}
          SHARD: ${{ matrix.unit_shard }}
        run: |
          args=()
          [ -n "$STAGES" ] && args+=(--stages "$STAGES")
          [ -n "$SHARD" ] && args+=(--unit-shard "$SHARD")
          test/run.sh "${args[@]}" "$REF"
      - name: Mark as passed
        env:
          MARKER: passed-${{ matrix.name }}--${{ matrix.part }}
        run: mkdir -p "pass/$MARKER" && cp marker/digest "pass/$MARKER/digest"
      # One marker per test part; promote needs every part's (#86). The
      # artifact holds passed-<name>--<part>/digest (a directory path is the
      # artifact's root), so a merge-multiple download lays every marker out
      # the same way whether one artifact matches or several (#101).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passed-${{ matrix.name }}--${{ matrix.part }}
          path: pass
          retention-days: 1

  promote:
    name: promote ${{ matrix.name }}
    needs: [resolve, test]
    # Per image: an image is tagged only if every one of its test jobs
    # passed (a passed-<name>--<part> marker per part, all naming the same
    # digest), whatever happened to the others.
    if: ${{ !cancelled() && needs.resolve.outputs.count != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless cosign signature + provenance
      attestations: write
      security-events: write   # the CVE report of the promoted digest (code scanning)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find this image's pass markers
        id: passed
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: passed-${{ matrix.name }}--*
          path: pass
          merge-multiple: true
      - name: Stop unless every test part passed
        id: gate
        env:
          NAME: ${{ matrix.name }}
          PARTS: ${{ toJSON(matrix.test_parts) }}
        run: |
          if ! digest=$(python3 tools/pass_markers.py pass "$NAME" "$PARTS"); then
            echo "::error::$NAME did not pass every test job: no tag is created"
            echo "$NAME: not promoted (tests did not pass)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image's inventory (#38), generated from the tested candidate digest
      # before any tag is created, so a failure here publishes nothing. ns-3
      # is built from source (no package record for Trivy to find), so it is
      # added as its own component, versioned from the image label.
      - name: SBOM (CycloneDX, Trivy pinned by digest)
        env:
          DIGEST: ${{ steps.gate.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Trivy runs as root: write through stdout so the runner owns the file.
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY" image --quiet \
            --image-src remote --format cyclonedx "${CANDIDATE}@${DIGEST}" > sbom.cdx.json
          docker buildx imagetools inspect "${CANDIDATE}@${DIGEST}" --format '{{json .Image}}' > image.json
          python3 - <<'PY'
          import json
          img = json.load(open("image.json"))
          if "config" not in img:  # an index: one config per platform, same labels
              img = next(iter(img.values()))
          ver = img["config"]["Labels"]["org.opencontainers.image.version"]
          bom = json.load(open("sbom.cdx.json"))
          purl = f"pkg:git/gitlab.com/nsnam/ns-3-dev@ns-{ver}"
          bom.setdefault("components", []).append({
              "type": "framework", "bom-ref": purl, "name": "ns-3", "version": ver, "purl": purl,
              "licenses": [{"license": {"id": "GPL-2.0-only"}}],
              "externalReferences": [{"type": "vcs", "url": "https://gitlab.com/nsnam/ns-3-dev"}],
              "properties": [{"name": "swarm-routing:path", "value": "/opt/ns-3"}],
          })
          json.dump(bom, open("sbom.cdx.json", "w"), indent=1)
          print(f"SBOM: {len(bom['components'])} components (ns-3 {ver} included)")
          PY
          echo "SBOM: $(python3 -c 'import json; print(len(json.load(open("sbom.cdx.json"))["components"]))') components, ns-3 included" >> "$GITHUB_STEP_SUMMARY"
      - name: Tag the tested digest (carbon copy, no rebuild)
        env:
          DIGEST: ${{ steps.gate.outputs.digest }}
          TAGS: ${{ matrix.tags }}
        run: |
          # A -<sha7> tag is an immutable pin: once it points at a digest it
          # never moves, even when a re-run or dispatch of the same commit
          # builds a new digest (each image carries its run's label). Only the
          # rolling tags follow the newest tested digest.
          sha7="${GITHUB_SHA::7}"
          set_tags=(); kept=()
          for t in $TAGS; do
            if [[ "$t" != *"-${sha7}" ]]; then set_tags+=("$t"); continue; fi
            # Fail closed: only a tag the registry confirms absent is new; any
            # other lookup error stops promotion rather than move a pin.
            if out=$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{json .Manifest}}' 2>&1); then
              cur=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' <<<"$out")
              if [ "$cur" = "$DIGEST" ]; then set_tags+=("$t"); else kept+=("$t ($cur)"); fi
            elif grep -qiE 'not found|manifest unknown' <<<"$out"; then
              set_tags+=("$t")
            else
              echo "$out" >&2
              echo "::error::cannot tell whether ${IMAGE}:${t} exists; not promoting"; exit 1
            fi
          done
          args=()
          for t in "${set_tags[@]}"; do args+=(-t "${IMAGE}:${t}"); done
          docker buildx imagetools create "${args[@]}" "${CANDIDATE}@${DIGEST}"
          for k in "${kept[@]}"; do echo "kept immutable pin \`$k\`" >> "$GITHUB_STEP_SUMMARY"; done
          TAGS="${set_tags[*]}"
          # The copy must be byte-identical: the published digest is the tested one.
          for t in $TAGS; do
            got=$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
            [ "$got" = "$DIGEST" ] || { echo "::error::${IMAGE}:${t} is $got, tested $DIGEST"; exit 1; }
          done
          { echo "promoted \`${IMAGE}@${DIGEST}\`:"; for t in $TAGS; do echo "- \`$t\`"; done; } >> "$GITHUB_STEP_SUMMARY"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless, by digest)
        env:
          DIGEST: ${{ steps.gate.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.gate.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.gate.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      # The signature must verify against this exact workflow identity.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.gate.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "signature verified for \`$IDENTITY\`" >> "$GITHUB_STEP_SUMMARY"
      # Visibility only, after the image is published: the CVEs Trivy knows of
      # in the promoted digest go to code scanning, one category per image, so
      # vulnerabilities disclosed after the build show up there. The gate is
      # test/run.sh's security stage (fixable MEDIUM+ blocks the promotion);
      # this scan never fails the job, never blocks latest-*, and scans the
      # same digest that was tested and tagged (no rebuild, no pull).
      - name: CVE report of the promoted digest (Trivy, non-blocking)
        continue-on-error: true
        env:
          DIGEST: ${{ steps.gate.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Trivy runs as root: write through stdout so the runner owns the file.
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY" image --quiet \
            --image-src remote --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH \
            --exit-code 0 --format sarif "${IMAGE}@${DIGEST}" > trivy-image.sarif
      - name: Upload the CVE report to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.name }}

  canary:
    name: downstream canary ${{ matrix.name }}
    needs: [resolve, test]
    # On the tested candidate, in parallel with promote. Fork PRs have no
    # candidate; on any PR the result is advisory (see the header).
    if: ${{ !cancelled() && needs.resolve.outputs.canary_count != '0' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: read       # pull the candidate
      issues: write        # report a failing consumer
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.canary) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only an image that passed test/run.sh is canaried: every test part
      # left its marker and all name the same digest (tools/pass_markers.py).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: passed-${{ matrix.name }}--*
          path: pass
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the candidate by digest
        id: pull
        env:
          NAME: ${{ matrix.name }}
          PARTS: ${{ toJSON(matrix.test_parts) }}
        run: |
          digest=$(python3 tools/pass_markers.py pass "$NAME" "$PARTS")
          ref="${CANDIDATE}@${digest}"
          docker pull "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Build and test the org's modules (test/downstream.txt)
        env:
          REF: ${{ steps.pull.outputs.ref }}
          DOWNSTREAM_FAILED: ${{ runner.temp }}/downstream-failed
        run: test/downstream.sh "$REF"
      # A failing consumer on main (or a scheduled or dispatched run of it):
      # one open issue per consumer and release, updated on every new failure.
      - name: Open or update an issue per failing consumer
        if: ${{ failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ runner.temp }}/downstream-failed
          VERSION: ${{ matrix.version }}
          REF: ${{ steps.pull.outputs.ref }}
        run: |
          [ -s "$FAILED" ] || { echo "no consumer failed (the failure is the job's own)"; exit 0; }
          log="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          while read -r name src reason; do
            title="downstream canary: ${name} fails on ns3-dev ${VERSION}"
            body=$(printf '%s\n' \
              "The downstream canary (\`test/downstream.sh\`, #44) failed for **${name}** on the candidate \`${REF}\` (ns-3 ${VERSION}, ubuntu debug)." \
              "" \
              "- consumer: [\`${src}\`](https://github.com/${src%@*}/commit/${src#*@})" \
              "- result: ${reason}" \
              "- log: ${log} (job *downstream canary*)" \
              "" \
              "\`latest-*\` was not moved: it stays on the previous digest until every consumer passes. Reproduce with \`test/downstream.sh <image-ref>\`." \
              "" "---" "_Opened by publish-images.yml_")
            num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${title}\" in:title" \
                    --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -1)
            if [ -n "$num" ]; then
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
              echo "${name}: updated #${num}" >> "$GITHUB_STEP_SUMMARY"
            else
              url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label bug --label ns3 --body "$body")
              echo "${name}: opened ${url}" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$FAILED"

  latest:
    name: move latest-*
    needs: [resolve, test, promote, canary]
    # Last, and only when every required (non-experimental) image passed its
    # tests and was promoted, and every downstream canary passed: `latest`
    # never points at a partial set, nor at a release that breaks a consumer.
    if: ${{ !cancelled() && needs.resolve.outputs.count != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.promote.result == 'success' && needs.canary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: passed-*
          path: pass
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag latest-* onto the promoted digests
        env:
          MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          echo "every downstream canary passed (the *downstream canary* jobs' summaries list each consumer and commit)" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$MATRIX" | python3 -c 'import json,sys; [print(e["name"], json.dumps(e["test_parts"], separators=(",", ":")), e["latest_tags"]) for e in json.load(sys.stdin)["include"] if e["latest_tags"]]' |
          while read -r name parts tags; do
            if ! digest=$(python3 tools/pass_markers.py pass "$name" "$parts"); then
              echo "$name: did not pass (experimental), latest tags left as they are" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # An experimental image can pass its tests and still fail to be
            # promoted (its promote leg may fail without failing the run);
            # its digest is then not in ns3-dev and its latest tags stay put.
            if ! docker buildx imagetools inspect "${IMAGE}@${digest}" >/dev/null 2>&1; then
              echo "$name: passed but not promoted, latest tags left as they are" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            args=()
            for t in $tags; do args+=(-t "${IMAGE}:${t}"); done
            docker buildx imagetools create "${args[@]}" "${IMAGE}@${digest}"
            echo "$name: ${tags} -> \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done

  discard:
    name: discard this run's candidates
    needs: [resolve, select, test, promote, canary, latest]
    # Every run, PRs included, deletes the candidates it pushed once nothing
    # needs them: after a clean run (tests passed, or select chose none, and,
    # on main, the tags were copied). A run with a failure keeps them, so "re-run failed jobs" can
    # still promote by digest; candidates-cleanup.yml removes those after 7
    # days. Fork PRs push no candidate.
    if: >-
      ${{ !cancelled() && needs.resolve.outputs.count != '0'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && needs.select.result == 'success'
          && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.select.outputs.count == '0'))
          && contains(fromJSON('["success","skipped"]'), needs.promote.result)
          && contains(fromJSON('["success","skipped"]'), needs.canary.result)
          && contains(fromJSON('["success","skipped"]'), needs.latest.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete the candidates and their untagged child manifests
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          # Each candidate is an index; its image and provenance manifests are
          # the untagged versions GHCR lists next to it. Delete exactly those
          # digests: another run's candidates, in test right now, are untouched.
          : > doomed
          for f in digests/*/digest; do
            d=$(cat "$f")
            echo "$d" >> doomed
            docker buildx imagetools inspect --raw "${CANDIDATE}@${d}" \
              | python3 -c 'import json,sys; [print(m["digest"]) for m in json.load(sys.stdin).get("manifests", [])]' >> doomed
          done
          base="/orgs/${ORG}/packages/container/ns3-dev-ci/versions"
          gh api --paginate "${base}?per_page=100" --jq '.[] | "\(.id) \(.name)"' > versions
          n=0; refused=()
          while read -r id name; do
            grep -qxF "$name" doomed || continue
            if gh api -X DELETE "${base}/${id}" > /dev/null 2>&1; then n=$((n + 1)); else refused+=("$id"); fi
          done < versions
          echo "discarded ${n} candidate versions of this run ($(wc -l < doomed) digests)" >> "$GITHUB_STEP_SUMMARY"
          # GHCR refuses to delete a package's last version, and only that one
          # may be refused: anything else is a real failure.
          if [ "${#refused[@]}" -gt 0 ]; then
            left=$(gh api --paginate "${base}?per_page=100" --jq '.[].id' | wc -l)
            if [ "${#refused[@]}" -eq 1 ] && [ "$left" -eq 1 ]; then
              echo "kept version ${refused[0]}: the package's last version (candidates-cleanup takes it later)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::could not delete candidate versions ${refused[*]} (${left} versions remain)"
              exit 1
            fi
          fi

  # The one check to require in branch protection (as AntHocNet's CI gate):
  # passes when every job above passed or was skipped (a PR outside the
  # image paths, or the main-only jobs on a PR), fails on any failure or
  # cancellation. Experimental legs (Alpine) are continue-on-error, so their
  # failure never reaches it.
  gate:
    name: images gate
    if: always()
    needs: [resolve, build, select, test, promote, latest, discard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          for k, v in sorted(needs.items()):
              print("%9s  %s" % (v["result"], k))
          sys.exit(f"images gate: {bad}" if bad else 0)
          '
