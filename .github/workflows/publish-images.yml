name: Publish images

# Builds ghcr.io/swarm-routing/ns3-dev, as generated by tools/ns3_matrix.py
# from upstream's tags (never a hand-kept list).
#
# Automatic pipelines build only the release ns-3 supports: ns-3 maintains its
# latest release only (no maintenance branches, no backports). That release
# gets every profile on Ubuntu, default + debug on Debian and debian-slim, and
# one experimental Alpine image. Any other release is built on demand with the
# `versions` input (Ubuntu x default, debug); its images are history and no
# automatic pipeline rebuilds them. Each image is smoke-tested with
# test/smoke.sh (a contrib module must build incrementally and pass test.py),
# then pushed, signed and attested.
#
#   push to main (docker/, test/, tools/, this file)  supported release: build + smoke + push
#   pull request (same paths)                          supported release: build + smoke, no push
#   schedule (weekly)                                  supported release, only if not yet published
#   workflow_dispatch                                  `versions` (any release, on demand), else
#                                                      the supported release; push on main
#
# Tags (see tools/ns3_matrix.py): :<ver>-<profile>, :<ver> (= default profile),
# :<ver>-<os>-<profile>, the supported release's :latest-<profile> and :latest,
# and an immutable -<sha7> twin of each versioned tag; pin the twin in anything
# that produces a published number.
#
# Cache: buildx registry cache in ghcr.io/<owner>/ns3-dev-cache, one tag per
# version x os x profile (`mode=max`), outside the 10 GB Actions cache. main
# and same-repo PRs write it; fork PRs only read. No workflow artifacts are
# uploaded here.
on:
  push:
    branches: [main]
    paths: ['docker/**', 'test/**', 'tools/**', '.github/workflows/publish-images.yml']
  pull_request:
    paths: ['docker/**', 'test/**', 'tools/**', '.github/workflows/publish-images.yml']
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC: pick up new ns-3 releases
  workflow_dispatch:
    inputs:
      versions:
        description: 'On demand: comma-separated ns-3 releases (e.g. 3.36,3.42); empty = the supported (latest) release'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ns3-dev
  CACHE: ghcr.io/${{ github.repository_owner }}/ns3-dev-cache
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  # Same-repo PRs and main may write the registry cache; fork PRs cannot.
  WRITE_CACHE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  resolve:
    name: resolve the ns-3 release(s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the matrix generator
        run: python3 -m unittest discover -s tools -v
      - name: Generate the matrix from upstream tags
        id: m
        env:
          VERSIONS: ${{ inputs.versions }}
          MISSING_ONLY: ${{ github.event_name == 'schedule' }}
        run: |
          args=(--sha "$GITHUB_SHA" --image "$IMAGE")
          [ -n "$VERSIONS" ] && args+=(--versions "$VERSIONS")
          [ "$MISSING_ONLY" = true ] && args+=(--missing-only)
          matrix=$(python3 tools/ns3_matrix.py "${args[@]}")
          count=$(printf '%s' "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          printf '%s' "$matrix" | python3 -c 'import json,sys; [print(e["name"], "<-", e["version"], "|", e["tags"]) for e in json.load(sys.stdin)["include"]]' >> "$GITHUB_STEP_SUMMARY"

  image:
    name: ns3-dev ${{ matrix.name }}
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Alpine (musl) is outside ns-3's supported platforms: its failure is
    # reported but never fails the run (ns3-containers#8).
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless cosign signature + provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tags
        id: tags
        env:
          TAGS: ${{ matrix.tags }}
          NAME: ${{ matrix.name }}
        run: |
          echo "local=${IMAGE}:${NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "all<<EOF"
            for t in $TAGS; do echo "${IMAGE}:${t}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: env.PUSH == 'true' || env.WRITE_CACHE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (load for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BASE_OS=${{ matrix.os }}
            NS3_VERSION=${{ matrix.version }}
            BUILD_PROFILE=${{ matrix.profile }}
          tags: ${{ steps.tags.outputs.local }}
          load: true
          cache-from: type=registry,ref=${{ env.CACHE }}:${{ matrix.cache }}
          cache-to: ${{ env.WRITE_CACHE == 'true' && format('type=registry,ref={0}:{1},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE, matrix.cache) || '' }}
      - name: Smoke test (contrib build is incremental, test.py passes)
        run: docker run --rm -v "$PWD:/src:ro" "${{ steps.tags.outputs.local }}" bash /src/test/smoke.sh
      - name: Push (from the cache the build step just wrote)
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BASE_OS=${{ matrix.os }}
            NS3_VERSION=${{ matrix.version }}
            BUILD_PROFILE=${{ matrix.profile }}
          tags: ${{ steps.tags.outputs.all }}
          push: true
          cache-from: type=registry,ref=${{ env.CACHE }}:${{ matrix.cache }}
      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless, by digest)
        if: env.PUSH == 'true'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Attest provenance
        if: env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
