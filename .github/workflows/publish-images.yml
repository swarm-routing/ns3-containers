name: Publish images

# Builds ghcr.io/swarm-routing/ns3-dev:<ns3-version>-<profile> for every
# version x profile, smoke-tests each image with test/smoke.sh (a C++20 contrib
# module must build incrementally and pass test.py), then pushes.
#
#   push to main (docker/, test/, this file)  build + smoke + push
#   pull request (same paths)                 build + smoke, no push
#   workflow_dispatch                         build + smoke, push if on main
#
# Tags per image:
#   :<ver>-<profile>          rolling, e.g. :3.43-debug
#   :<ver>-<profile>-<sha7>   immutable, the commit that built it; pin this in
#                             anything that produces a published number
#
# Cache hygiene (org invariant 5): one buildx GHA cache scope per
# version x profile (`mode=max`), so profiles never evict each other's layers
# and a PR reuses main's layers. The repo's 10 GB Actions cache budget holds
# the three 3.43 scopes; prune old scopes when a version is dropped. No
# workflow artifacts are uploaded here.
on:
  push:
    branches: [main]
    paths: ['docker/**', 'test/**', '.github/workflows/publish-images.yml']
  pull_request:
    paths: ['docker/**', 'test/**', '.github/workflows/publish-images.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ns3-dev
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  image:
    name: ns3-dev ${{ matrix.version }}-${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless cosign signature + provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        version: ['3.43']
        profile: [optimized, debug, sanitized]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tags
        id: tags
        env:
          TAG: ${{ matrix.version }}-${{ matrix.profile }}
        run: |
          echo "rolling=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "pinned=${IMAGE}:${TAG}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build (load for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            NS3_VERSION=${{ matrix.version }}
            BUILD_PROFILE=${{ matrix.profile }}
          tags: ${{ steps.tags.outputs.rolling }}
          load: true
          cache-from: type=gha,scope=ns3-${{ matrix.version }}-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=ns3-${{ matrix.version }}-${{ matrix.profile }}
      - name: Smoke test (contrib build is incremental, test.py passes)
        run: docker run --rm -v "$PWD:/src:ro" "${{ steps.tags.outputs.rolling }}" bash /src/test/smoke.sh
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (from the cache the build step just wrote)
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            NS3_VERSION=${{ matrix.version }}
            BUILD_PROFILE=${{ matrix.profile }}
          tags: |
            ${{ steps.tags.outputs.rolling }}
            ${{ steps.tags.outputs.pinned }}
          push: true
          cache-from: type=gha,scope=ns3-${{ matrix.version }}-${{ matrix.profile }}
      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless, by digest)
        if: env.PUSH == 'true'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Attest provenance
        if: env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
