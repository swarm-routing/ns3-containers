name: Publish images

# Builds ghcr.io/swarm-routing/ns3-dev, as generated by tools/ns3_matrix.py
# from upstream's tags (never a hand-kept list).
#
# Automatic pipelines build only the release ns-3 supports: ns-3 maintains its
# latest release only (no maintenance branches, no backports). That release
# gets every profile on Ubuntu, default + debug on Debian and debian-slim, and
# one experimental Alpine image. Any other release is built on demand with the
# `versions` input (Ubuntu x default, debug); its images are history and no
# automatic pipeline rebuilds them.
#
# Build once, test by digest, promote by retagging (ns3-containers#37):
#
#   build    each image is built ONCE and pushed to the candidate package
#            ns3-dev-ci (never pulled by consumers); its digest is recorded
#   test     every test stage (test/run.sh) runs on <candidate>@<digest>,
#            the image that build produced -- never a rebuild, never a tag
#   promote  an image whose tests passed gets its versioned and -<sha7> tags
#            by `imagetools create` from that same digest (a carbon copy, no
#            rebuild), then is signed and attested by digest
#   latest   the latest-* tags move last, only when every required image of
#            the run passed (Alpine is experimental: it never blocks)
#
# Automatic and on-demand builds go through the same jobs and the same tests
# (ns3-containers#36). A fork PR cannot push a candidate: its build job loads
# the image and runs the same test/run.sh on it in place.
#
#   push to main (docker/, test/, tools/, this file)  supported release: build + test + promote
#   pull request (same paths)                          supported release: build + test
#   schedule (weekly)                                  supported release, only if not yet published
#   workflow_dispatch                                  `versions` (any release, on demand), else
#                                                      the supported release; promote on main
#
# Tags (see tools/ns3_matrix.py): :<ver>-<profile>, :<ver> (= default profile),
# :<ver>-<os>-<profile>, the supported release's :latest-<profile> and :latest,
# and an immutable -<sha7> twin of each versioned tag; pin the twin in anything
# that produces a published number.
#
# Cache: buildx registry cache in ghcr.io/<owner>/ns3-dev-cache, one tag per
# version x os x profile (`mode=max`), outside the 10 GB Actions cache. main
# and same-repo PRs write it and push candidates; fork PRs only read.
# Candidates are deleted after 7 days (candidates-cleanup.yml). The only
# workflow artifacts are one-line digest/pass markers, kept 1 day.
on:
  push:
    branches: [main]
    paths: ['docker/**', 'test/**', 'tools/**', '.github/workflows/publish-images.yml']
  pull_request:
    paths: ['docker/**', 'test/**', 'tools/**', '.github/workflows/publish-images.yml']
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC: pick up new ns-3 releases
  workflow_dispatch:
    inputs:
      versions:
        description: 'On demand: comma-separated ns-3 releases (e.g. 3.36,3.42); empty = the supported (latest) release'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ns3-dev
  CANDIDATE: ghcr.io/${{ github.repository_owner }}/ns3-dev-ci
  CACHE: ghcr.io/${{ github.repository_owner }}/ns3-dev-cache
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  # Same-repo PRs and main may write the registry (cache, candidates); fork PRs cannot.
  WRITE_REGISTRY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  resolve:
    name: resolve the ns-3 release(s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the matrix generator
        run: python3 -m unittest discover -s tools -v
      - name: Generate the matrix from upstream tags
        id: m
        env:
          VERSIONS: ${{ inputs.versions }}
          MISSING_ONLY: ${{ github.event_name == 'schedule' }}
        run: |
          args=(--sha "$GITHUB_SHA" --image "$IMAGE")
          [ -n "$VERSIONS" ] && args+=(--versions "$VERSIONS")
          [ "$MISSING_ONLY" = true ] && args+=(--missing-only)
          matrix=$(python3 tools/ns3_matrix.py "${args[@]}")
          count=$(printf '%s' "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          printf '%s' "$matrix" | python3 -c 'import json,sys; [print(e["name"], "<-", e["version"], "|", e["tags"]) for e in json.load(sys.stdin)["include"]]' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.name }}
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Alpine (musl) is outside ns-3's supported platforms: its failure is
    # reported but never fails the run (ns3-containers#8).
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      packages: write      # registry cache + candidate push
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.WRITE_REGISTRY == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The one and only build of this image. It is pushed under a unique
      # candidate tag; everything after this addresses it by digest.
      - name: Build once (push the candidate)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BASE_OS=${{ matrix.os }}
            NS3_VERSION=${{ matrix.version }}
            BUILD_PROFILE=${{ matrix.profile }}
          tags: ${{ env.WRITE_REGISTRY == 'true' && format('{0}:{1}-{2}-{3}', env.CANDIDATE, github.run_id, github.run_attempt, matrix.name) || format('ns3-dev-local:{0}', matrix.name) }}
          push: ${{ env.WRITE_REGISTRY == 'true' }}
          # A fork PR cannot push: it loads the image and is tested in place.
          load: ${{ env.WRITE_REGISTRY != 'true' }}
          cache-from: type=registry,ref=${{ env.CACHE }}:${{ matrix.cache }}
          cache-to: ${{ env.WRITE_REGISTRY == 'true' && format('type=registry,ref={0}:{1},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE, matrix.cache) || '' }}
      - name: Record the digest
        if: env.WRITE_REGISTRY == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "no digest from the build: '$DIGEST'" >&2; exit 1 ;; esac
          mkdir -p marker && echo "$DIGEST" > "marker/digest"
          echo "candidate \`${CANDIDATE}@${DIGEST}\` ($NAME)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the digest
        if: env.WRITE_REGISTRY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}
          path: marker/digest
          retention-days: 1
      - name: Test in place (fork PR, no candidate)
        if: env.WRITE_REGISTRY != 'true'
        env:
          NAME: ${{ matrix.name }}
        run: test/run.sh "ns3-dev-local:${NAME}"

  test:
    name: test ${{ matrix.name }}
    needs: [resolve, build]
    # Run each image's tests even if another image failed to build; a leg
    # whose own build failed finds no digest and fails here, which is right.
    if: ${{ !cancelled() && needs.resolve.outputs.count != '0' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      packages: read       # pull the candidate; tests can never push or tag
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.name }}
          path: marker
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the candidate by digest
        id: pull
        run: |
          ref="${CANDIDATE}@$(cat marker/digest)"
          docker pull "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Test stages
        env:
          REF: ${{ steps.pull.outputs.ref }}
        run: test/run.sh "$REF"
      - name: Mark as passed
        run: mkdir -p pass && cp marker/digest pass/digest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passed-${{ matrix.name }}
          path: pass/digest
          retention-days: 1

  promote:
    name: promote ${{ matrix.name }}
    needs: [resolve, test]
    # Per image: an image is tagged only if its own tests passed (its
    # passed-<name> marker exists), whatever happened to the others.
    if: ${{ !cancelled() && needs.resolve.outputs.count != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless cosign signature + provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find this image's pass marker
        id: passed
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: passed-${{ matrix.name }}
          path: pass
      - name: Stop if its tests did not pass
        id: gate
        env:
          NAME: ${{ matrix.name }}
        run: |
          if [ ! -s pass/digest ]; then
            echo "::error::$NAME did not pass its tests: no tag is created"
            echo "$NAME: not promoted (tests did not pass)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "digest=$(cat pass/digest)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested digest (carbon copy, no rebuild)
        env:
          DIGEST: ${{ steps.gate.outputs.digest }}
          TAGS: ${{ matrix.tags }}
        run: |
          args=()
          for t in $TAGS; do args+=(-t "${IMAGE}:${t}"); done
          docker buildx imagetools create "${args[@]}" "${CANDIDATE}@${DIGEST}"
          # The copy must be byte-identical: the published digest is the tested one.
          for t in $TAGS; do
            got=$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
            [ "$got" = "$DIGEST" ] || { echo "::error::${IMAGE}:${t} is $got, tested $DIGEST"; exit 1; }
          done
          { echo "promoted \`${IMAGE}@${DIGEST}\`:"; for t in $TAGS; do echo "- \`$t\`"; done; } >> "$GITHUB_STEP_SUMMARY"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless, by digest)
        env:
          DIGEST: ${{ steps.gate.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.gate.outputs.digest }}
          push-to-registry: true

  latest:
    name: move latest-*
    needs: [resolve, test, promote]
    # Last, and only when every required (non-experimental) image passed its
    # tests and was promoted: `latest` never points at a partial set.
    if: ${{ !cancelled() && needs.resolve.outputs.count != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.promote.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: passed-*
          path: pass
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag latest-* onto the promoted digests
        env:
          MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          printf '%s' "$MATRIX" | python3 -c 'import json,sys; [print(e["name"], e["latest_tags"]) for e in json.load(sys.stdin)["include"] if e["latest_tags"]]' |
          while read -r name tags; do
            f="pass/passed-${name}/digest"
            if [ ! -s "$f" ]; then
              echo "$name: did not pass (experimental), latest tags left as they are" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            digest=$(cat "$f")
            args=()
            for t in $tags; do args+=(-t "${IMAGE}:${t}"); done
            docker buildx imagetools create "${args[@]}" "${IMAGE}@${digest}"
            echo "$name: ${tags} -> \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done
