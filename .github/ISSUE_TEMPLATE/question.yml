name: Question
description: A usage or behaviour question — how to run, configure, or interpret something.
title: "[question] "
labels: ["question"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do
      description: >
        The end goal, and — if something surprised you — what you expected
        versus what you got.
    validations:
      required: true
  - type: textarea
    id: read
    attributes:
      label: What did you already read / try
      description: >
        Docs pages (the repo's `docs/`, the org site), issues you searched, commands
        you ran. This keeps answers from repeating what you already know.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Simulator and version (ns-3.x), OS, and the protocol repo's release
        or commit, and the ns3-dev image tag — if the question involves running anything.
