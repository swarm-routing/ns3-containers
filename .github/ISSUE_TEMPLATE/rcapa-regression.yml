name: Regression in a release (RCAPA)
description: A regression in a published library, one another project consumes at a version (a swarm-core or ns3-tools release, a vcpkg port), or an image whose composition broke. Root cause analysis + corrective and preventive actions (CONTRIBUTING.md, "RCAPA"). Not for unreleased bugs, image bugs outside their composition, or ns-3 bugs.
title: "[rcapa] <PREFIX>-NNN "
labels: ["rcapa", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        An RCAPA is required only for a **regression in a published library**: a version another project consumes (a swarm-core release through `swarm-core.lock` or the vcpkg baseline, an ns3-tools release through `ns3-tools.lock` or PyPI, a protocol core's vcpkg port, a port recipe at a registry baseline, any release a consumer pins by version) worked, and a later one broke. A Docker image qualifies only when its composition (Dockerfile, `build-contrib.sh`, configure line, base image) is the cause. A bug that never reached a published version, and any change in .github, the site, skills, benchmarks or ns3-upstream-report, is an ordinary *Bug report*; an upstream ns-3 bug uses *ns-3 bug (RCAPA)* in swarm-routing/ns3-tools (CONTRIBUTING.md, "RCAPA", the decision table).
        A consumer that finds it (say AntHocNet after a swarm-core lock bump) files this in the **library's** repository, with its failing check as the reproducer. Replace `<PREFIX>` with that repository's prefix (CONTRIBUTING.md, "RCAPA") and `NNN` with the next free number in its `docs/rcapa/README.md`. The RCAPA document follows `docs/rcapa/_template.md`.
        Write every reference in full: `swarm-routing/<repo>#N`, never a bare `#N`. Add `priority:*`, `model:*` and the area labels as for any other issue (root cause work: usually `model:opus-5.5`).
        This ticket stays open until the corrective action is merged **and a release carries the fix**.
  - type: input
    id: releases
    attributes:
      label: Releases
      description: The library version seen to fail and the last one seen to pass, and the consumer that pins it, e.g. "swarm-core v1.1.0 fails, v1.0.0 passes, in AntHocNet's swarm-core.lock bump (swarm-routing/AntHocNet#N); introduced by <commit>".
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >
        Where it was found (repository, workflow, campaign, a user report) and who it touches:
        the users of the release, numbers published from it, downstream repositories pinned to it.
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What goes wrong, observed, without the cause (a crash with its message, a changed `##RUN##` line, a failing test, a wrong output).
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: Enough to rerun it with no chat history.
      value: |
        - Command:
        - Release / commit, and image by tag and digest if one is involved:
        - Seed / run:
        - Expected (the last good release):
        - Actual:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: CI job links, logs, marker lines, source lines as `file:line` at a named commit, the commit that introduced it.
    validations:
      required: true
  - type: input
    id: ns3
    attributes:
      label: ns-3 (optional)
      description: The ns-3 version and modules involved, if any. If the cause turns out to be upstream ns-3, it moves to an `NS3-NNN` ticket in swarm-routing/ns3-tools.
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: What users of the release can do until the fix ships, or "none".
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this RCAPA covers (the regression, the corrective and preventive actions) and what it does not.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] RCAPA doc `docs/rcapa/rcapa-<short-description>.md` and its row in `docs/rcapa/README.md`
        - [ ] 5 whys, each cited (a source line at a commit, a log, a run)
        - [ ] Reproducer verified against the failing release and the last good one (the consumer's failing check, when a consumer found it)
        - [ ] Corrective action merged (cross-repo form `swarm-routing/<repo>#N`)
        - [ ] Preventive actions linked (a test or check that catches a recurrence)
        - [ ] A release carries the fix (tag and DOI recorded in the RCAPA), and the consumer that found it runs green on it
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Cross-repo form `swarm-routing/<repo>#N`.
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Related issues and PRs in every repository, written in full.
