# org-sync:begin coderabbit-head
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings (org decision 2026-11-01, swarm-routing/ns3-containers#18):
# the per-PR AI reviewer for every public swarm-routing repository. Comments
# only: it never approves or requests changes, and it is not a required check.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  # Review budget (org decision 2026-11-02, swarm-routing/.github#37): review
  # each PR once when it opens; re-review on request (`@coderabbitai review`),
  # not on every push. Skip Dependabot bumps, which CI already checks.
  # (No title filter: ignore_title_keywords matches anywhere in a title, so
  # "style:" would also skip e.g. "fix: keep style: attributes".)
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
    ignore_usernames:
      - "dependabot[bot]"
  path_filters:
    - "!**/*.pdf"
  path_instructions:
    - path: "**/*"
      instructions: >-
        Review against this repository's AGENTS.md (golden rules) and the org rules in
        swarm-routing/.github CONTRIBUTING.md. Flag a broken invariant as a blocking
        issue; keep style nits minimal (clang-format, ruff, actionlint and shellcheck
        already run in CI).
    - path: "**/*.{h,hpp,cc,cpp,py,sh}"
      instructions: >-
        Every original source file starts with `Copyright (c) 2026 Daniel Joppi
        (https://github.com/swarm-routing)` and an SPDX-License-Identifier that
        matches its directory's row in LICENSING.md: `MIT OR GPL-2.0-only` for a
        simulator-free core/ and standalone tooling, `GPL-2.0-only` for ns-3 modules,
        the site, docs and data. A new directory needs its LICENSING.md row in the
        same PR. Dual-licensed code must never include or import GPL-only code. Flag
        any code that looks copied from ns-3's src/aodv or src/olsr.
    - path: ".github/workflows/**"
      instructions: >-
        Third-party actions are pinned by full commit SHA with a `# vX.Y.Z` comment;
        the org's own workflows (any `uses: swarm-routing/.github/.github/workflows/*`,
        e.g. reusable-*.yml, sync-labels.yml) are called at @main by maintainer
        decision (2026-11-02, swarm-routing/.github rule 10), so do not ask to
        SHA-pin them. Permissions
        are minimal; transient artifacts use retention-days <= 7. Automatic CI targets
        ghcr.io/swarm-routing/ns3-dev:latest-<profile> (the ns-3 release ns-3
        supports); older ns-3 releases only on demand via workflow_dispatch (org
        invariant 7). CI never uses the `optimized` image.
    - path: "**/*.md"
      instructions: >-
        Docs are for ns-3 developers: commands must be runnable and exact; no invented
        numbers, DOIs or citations; paywalled papers never committed to public
        repositories.
# org-sync:end coderabbit-head
    - path: "docker/**"
      instructions: >-
        docker/Dockerfile and docker/scripts/build-contrib.sh must pass identical
        profile flags, --enable-examples --enable-tests --disable-werror and module
        list; drift forces a full ns-3 rebuild downstream. `optimized` is ns-3's `-d
        release`, never ns-3's `optimized` (-march=native). Base images are pinned by
        digest.
    - path: "tools/**"
      instructions: >-
        The ns-3 version list is generated from upstream tags, never typed. Automatic
        pipelines build only the release ns-3 supports; older releases only on demand.
        Changes need matching tests in tools/test_ns3_matrix.py.
    - path: "test/**"
      instructions: >-
        test/smoke.sh must keep the Ninja step-count gate (warm cache) and the `core`
        module-name guard; the fixture must build on every ns-3 release in use (C++17
        to C++23).
# org-sync:begin coderabbit-tail
  tools:
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSING.md"
chat:
  auto_reply: true
# org-sync:end coderabbit-tail
