# Releases go through swarm-routing/.github's reusable-release.yml
# (.github/workflows/release.yml; CONTRIBUTING "Cutting a release" there).
# The version is the image pipeline's: its contract (tags, profiles, bases,
# ns3-build-contrib), never an image tag, which stays the ns-3 release.
# The first release is v1.0.0 (maintainer decision 2026-11-13): dispatch
# `bump` with increment MAJOR (swarm-routing/.github#211). Commitizen then
# bumps from the Conventional Commits since the last tag (a breaking change
# is a major: major_version_zero = false) and rewrites the files below.
[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
version_scheme = "semver"
tag_format = "v$version"
major_version_zero = false
update_changelog_on_bump = true
version_files = ["CITATION.cff:^version:"]
